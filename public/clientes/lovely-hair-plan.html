<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://specterspro.com/icon.svg" type="image/svg+xml">
<title>Calendario · Lovely Hair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbfaf6; --ink:#191913; --ink-soft:#4c4c42;
    --lime:#c8ef6f; --coral:#f37262; --night:#14171c; --err:#f37262;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(560px 420px at 88% 6%, rgba(200,239,111,.16), transparent 70%),
      radial-gradient(520px 400px at 6% 96%, rgba(243,114,98,.14), transparent 70%),
      var(--night);
    color:var(--paper);font:15px/1.55 'Inter',system-ui,-apple-system,sans-serif;padding:24px;
  }
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px;font-family:'Schibsted Grotesk',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;}
  .brand svg{width:26px;height:26px;color:var(--lime);}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:40px 34px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);font-weight:700;}
  h1{font-family:'Schibsted Grotesk',sans-serif;font-size:26px;margin:12px 0 6px;font-weight:800;letter-spacing:-.01em;color:var(--paper);}
  p{color:rgba(251,250,246,.68);font-size:14px;margin:0 0 24px;}
  .pw-wrap{position:relative;}
  input{width:100%;padding:13px 44px 13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:var(--paper);font-family:inherit;font-size:15px;outline:none;text-align:center;letter-spacing:.04em;transition:border-color .15s;}
  input::placeholder{color:rgba(251,250,246,.35);}
  input:focus{border-color:var(--lime);}
  .pw-toggle{position:absolute;right:5px;top:5px;bottom:5px;width:34px;display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:9px;color:rgba(251,250,246,.5);cursor:pointer;padding:0;margin:0;}
  .pw-toggle:hover{background:rgba(255,255,255,.06);color:var(--paper);}
  .pw-toggle svg{width:18px;height:18px;display:block;}
  .pw-toggle .ic-off{display:none;}
  .pw-toggle.is-visible .ic-on{display:none;}
  .pw-toggle.is-visible .ic-off{display:block;}
  button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:999px;background:var(--lime);color:var(--ink);font-family:'Schibsted Grotesk',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;}
  button:hover{opacity:.88;}
  button:disabled{opacity:.55;cursor:wait;}
  .err{color:var(--err);font-size:13px;margin-top:12px;min-height:18px;font-weight:500;}
  .foot{margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(251,250,246,.45);}
</style>
</head>

async function tryOpen(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:SALT, iterations:600000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:IV}, key, DATA);
  const html = new TextDecoder().decode(plain);
  sessionStorage.setItem('lh_pw', pw);
  document.open(); document.write(html); document.close();
}
const pwInput = document.getElementById('pw');
const pwToggle = document.getElementById('pwToggle');
pwToggle.addEventListener('click', ()=>{
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  pwToggle.classList.toggle('is-visible', show);
  pwToggle.setAttribute('aria-label', show ? 'Ocultar clave' : 'Mostrar clave');
  pwInput.focus();
});
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=document.getElementById('btn'), err=document.getElementById('err');
  btn.disabled=true; err.textContent='';
  try{ await tryOpen(document.getElementById('pw').value); }
  catch(_){ err.textContent='Clave incorrecta. Intenta de nuevo.'; btn.disabled=false; }
});
const saved = sessionStorage.getItem('lh_pw');
if (saved) tryOpen(saved).catch(()=>sessionStorage.removeItem('lh_pw'));
</script>
